# Back-end only: Postgres + API. Build context is the repo root (../..).
# Usage (from apps/back-end): docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teddy
      POSTGRES_PASSWORD: teddy
      POSTGRES_DB: teddy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teddy']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/back-end/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://teddy:teddy@postgres:5432/teddy
      JWT_SECRET: change-me-in-prod
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: admin@teddy.com
      ADMIN_PASSWORD: admin123
      OTEL_ENABLED: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
