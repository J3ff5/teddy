# Full local stack: Postgres + NestJS API + React (nginx).
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teddy
      POSTGRES_PASSWORD: teddy
      POSTGRES_DB: teddy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teddy']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/back-end/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://teddy:teddy@postgres:5432/teddy
      JWT_SECRET: change-me-in-prod
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: admin@teddy.com
      ADMIN_PASSWORD: admin123
      OTEL_ENABLED: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/front-end/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '5173:80'
    depends_on:
      - api

  # Optional cache (see spec). Uncomment to enable.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - '6379:6379'

volumes:
  pgdata:
